        - product_title
        - revenue
        - cogs
        - gross_margin
        - margin_percent
        - units_sold

    MarginReportCategoryRow:
      type: object
      properties:
        category_id:
          type: string
          nullable: true
        category_name:
          type: string
        revenue:
          type: number
        cogs:
          type: number
        gross_margin:
          type: number
        margin_percent:
          type: number
        units_sold:
          type: number
        unpriced_units_out:
          type: number
      required:
        - category_name
        - revenue
        - cogs
        - gross_margin
        - margin_percent
        - units_sold

    MarginReportResponse:
      type: object
      properties:
        start_date:
          type: string
        end_date:
          type: string
        total_revenue:
          type: number
        total_cogs:
          type: number
        total_gross_margin:
          type: number
        total_margin_percent:
          type: number
        total_units_sold:
          type: number
        total_unpriced_units:
          type: number
        unpriced_units_out:
          type: number
        variants:
          type: array
          items:
            $ref: "#/components/schemas/MarginReportVariantRow"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/MarginReportCategoryRow"
        best_contributors:
          type: array
          items:
            $ref: "#/components/schemas/MarginReportVariantRow"
        worst_contributors:
          type: array
          items:
            $ref: "#/components/schemas/MarginReportVariantRow"
      required:
        - start_date
        - end_date
        - total_revenue
        - total_cogs
        - total_gross_margin
        - total_margin_percent
        - total_units_sold
        - variants
        - categories
        - best_contributors
        - worst_contributors
    Stocktake:
      type: object
      properties:
        id:
          type: string
        stocktake_number:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [draft, posted, cancelled]
        is_opening_count:
          type: boolean
        posting_date:
          type: string
          nullable: true
        transaction_id:
          type: string
          nullable: true
        created_by:
          type: string
          nullable: true
        posted_by:
          type: string
          nullable: true
        posted_at:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        total_lines:
          type: integer
