openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inventory
    description: Inventory and barcode scan operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /inventory/scan/{barcode}:
    get:
      operationId: scanBarcode
      tags: [inventory]
      summary: Barcode scan lookup
      description: Single round-trip lookup returning matching variants and product details for a barcode
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of matched variants and their product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarcodeScanResult"
        "404":
          description: Barcode not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    VariantOption:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required:
        - name
        - value
    VariantScanDetail:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        price:
          type: number
        on_hand:
          type: number
        unit_of_measure:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/VariantOption"
      required:
        - id
        - price
        - on_hand
        - unit_of_measure
        - options
    ProductScanDetail:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        image_url:
          type: string
          nullable: true
      required:
        - id
        - title
        - slug
    BarcodeScanMatch:
      type: object
      properties:
        variant:
          $ref: "#/components/schemas/VariantScanDetail"
        product:
          $ref: "#/components/schemas/ProductScanDetail"
      required:
        - variant
        - product
    BarcodeScanResult:
      type: array
      items:
        $ref: "#/components/schemas/BarcodeScanMatch"
