          type: string
        variant_id:
          type: string
        counter_id:
          type: string
        counted_quantity:
          type: number
        location_note:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        sku:
          type: string
          nullable: true
        product_title:
          type: string
          nullable: true
        counter_name:
          type: string
          nullable: true
      required:
        - id
