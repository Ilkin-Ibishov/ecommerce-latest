openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inventory
    description: Inventory and barcode scan operations
  - name: suppliers
    description: Suppliers management
  - name: receipts
    description: Goods receipts and receiving workflow
  - name: margins
    description: Owner-only margin read and reports
  - name: stocktakes
    description: Physical stocktake, opening count, and variance review workflow
  - name: reservations
    description: Reservations, deposits, and customer hold ledger
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /inventory/scan/{barcode}:
    get:
      operationId: scanBarcode
      tags: [inventory]
      summary: Barcode scan lookup
      description: Single round-trip lookup returning matching variants and product details for a barcode
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of matched variants and their product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarcodeScanResult"
        "404":
          description: Barcode not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List suppliers
      responses:
        "200":
          description: List of suppliers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierList"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Get supplier by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Supplier details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "404":
          description: Supplier not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "200":
          description: Supplier updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      summary: Delete supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Supplier deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Error deleting supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/receipts:
    get:
      operationId: listGoodsReceipts
      tags: [receipts]
      summary: List goods receipts
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of goods receipts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodsReceiptList"
    post:
      operationId: createGoodsReceipt
      tags: [receipts]
      summary: Create draft goods receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoodsReceiptInput"
      responses:
        "201":
          description: Goods receipt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodsReceipt"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/receipts/{id}:
    get:
      operationId: getGoodsReceipt
      tags: [receipts]
      summary: Get goods receipt with line items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Goods receipt details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodsReceipt"
        "404":
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateGoodsReceipt
      tags: [receipts]
      summary: Update draft goods receipt header
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoodsReceiptInput"
      responses:
        "200":
          description: Goods receipt updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodsReceipt"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteGoodsReceipt
      tags: [receipts]
      summary: Discard draft goods receipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Receipt discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Error discarding receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/receipts/{id}/lines:
    post:
      operationId: addGoodsReceiptLine
      tags: [receipts]
      summary: Add line to draft goods receipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoodsReceiptLineInput"
      responses:
        "201":
          description: Line added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodsReceiptLine"
        "400":
          description: Error adding line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/receipts/{id}/lines/{lineId}:
    patch:
      operationId: updateGoodsReceiptLine
      tags: [receipts]
      summary: Update line in draft goods receipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoodsReceiptLineUpdateInput"
      responses:
        "200":
          description: Line updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodsReceiptLine"
        "400":
          description: Error updating line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteGoodsReceiptLine
      tags: [receipts]
      summary: Remove line from draft goods receipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Line removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Error removing line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/receipts/{id}/post:
    post:
      operationId: postGoodsReceiptAction
      tags: [receipts]
      summary: Atomically post goods receipt (Owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Receipt posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Error posting receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/receipts/{id}/reverse:
    post:
      operationId: reverseGoodsReceiptAction
      tags: [receipts]
      summary: Reverse posted goods receipt (Owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoodsReceiptReverseInput"
      responses:
        "200":
          description: Receipt reversed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Error reversing receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/reports/margins:
    get:
      operationId: getMarginReport
      tags: [margins]
      summary: Read margin report (Owner only)
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
        - name: endDate
          in: query
          required: true
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Margin report metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginReportResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (owner-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stocktakes:
    get:
      operationId: listStocktakes
      tags: [stocktakes]
      summary: List stocktakes
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, posted, cancelled]
      responses:
        "200":
          description: List of stocktakes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StocktakeList"
    post:
      operationId: createStocktake
      tags: [stocktakes]
      summary: Create draft stocktake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStocktakeRequest"
      responses:
        "201":
          description: Stocktake created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stocktake"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stocktakes/{id}:
    get:
      operationId: getStocktake
      tags: [stocktakes]
      summary: Get stocktake details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stocktake details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StocktakeDetail"
        "404":
          description: Stocktake not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateStocktake
      tags: [stocktakes]
      summary: Update draft stocktake header
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStocktakeRequest"
      responses:
        "200":
          description: Stocktake updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stocktake"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: discardStocktake
      tags: [stocktakes]
      summary: Discard draft stocktake
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stocktake discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Error discarding stocktake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stocktakes/{id}/lines:
    post:
      operationId: addStocktakeLine
      tags: [stocktakes]
      summary: Scan or add line to draft stocktake
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddStocktakeLineRequest"
      responses:
        "201":
          description: Line added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StocktakeLine"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stocktakes/{id}/lines/{lineId}:
    patch:
      operationId: updateStocktakeLine
      tags: [stocktakes]
      summary: Fix typo on count line
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStocktakeLineRequest"
      responses:
        "200":
          description: Line updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StocktakeLine"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeStocktakeLine
      tags: [stocktakes]
      summary: Delete line
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Line removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Error removing line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stocktakes/{id}/variance:
    get:
      operationId: getStocktakeVariance
      tags: [stocktakes]
      summary: Get variance and shrinkage report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Variance report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StocktakeVarianceReport"
        "400":
          description: Error generating variance report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stocktakes/{id}/resolve:
    post:
      operationId: resolveStocktakeVariant
      tags: [stocktakes]
      summary: Resolve multi-counter collision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveVariantRequest"
      responses:
        "200":
          description: Variant resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Error resolving variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stocktakes/{id}/opening-costs:
    post:
      operationId: setStocktakeOpeningCosts
      tags: [stocktakes]
      summary: Set opening costs for opening count
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOpeningCostsRequest"
      responses:
        "200":
          description: Opening costs saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Error saving opening costs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stocktakes/{id}/post:
    post:
      operationId: postStocktakeAction
      tags: [stocktakes]
      summary: Atomically post stocktake
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stocktake posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Error posting stocktake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/reservations:
    get:
      operationId: listReservations
      tags: [reservations]
      summary: List reservations
      description: Returns list of reservations with unified effective_status
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: variant_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: createReservation
      tags: [reservations]
      summary: Create deposit reservation
      description: Staff or owner records a customer deposit and holds inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Validation error or insufficient available stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/reservations/aged:
    get:
      operationId: listAgedReservations
      tags: [reservations]
      summary: List aged reservations
      description: Owner-only list of expired reservations and active deposits older than threshold
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 7
      responses:
        "200":
          description: List of aged reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/reservations/{id}/payment:
    post:
      operationId: recordReservationPayment
      tags: [reservations]
      summary: Record payment installment
      description: Staff records an additional cash installment against an active deposit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordReservationPaymentRequest"
      responses:
        "200":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Payment exceeds agreed price or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/reservations/{id}/fulfil:
    post:
      operationId: fulfilReservation
      tags: [reservations]
      summary: Fulfil reservation
      description: Customer pays remainder (if any) and collects goods; writes counter_sale movement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FulfilReservationRequest"
      responses:
        "200":
          description: Fulfilled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Shortfall or cannot fulfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/reservations/{id}/release:
    post:
      operationId: releaseReservation
      tags: [reservations]
      summary: Release reservation
      description: Owner cancels reservation and unreserves goods; records release reason
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseReservationRequest"
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Cannot release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (owner only)

  /admin/reservations/{id}/price:
    patch:
      operationId: updateReservationPrice
      tags: [reservations]
      summary: Renegotiate agreed price
      description: Owner-only price change for an active reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReservationPriceRequest"
      responses:
        "200":
          description: Price updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Price lower than paid amount or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (owner only)

  /admin/counter/lookup:
    get:
      operationId: counterLookup
      tags: [counter]
      summary: Find variants by exact barcode, else by name or SKU (staff)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /admin/counter/bundles:
    get:
      operationId: listCounterBundles
      tags: [counter]
      summary: Active bundles with their lines (staff)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /admin/counter/sales:
    get:
      operationId: listCounterSales
