components:
  schemas:
    PostCounterSaleRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sold_at:
          type: string
          format: date-time
        payment_method:
          type: string
          enum: [cash, card, other]
        note:
          type: string
          maxLength: 500
        owner_discount:
          type: number
          minimum: 0
          default: 0
        displayed_total:
          type: number
          minimum: 0
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            properties:
              variant_id:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
                maximum: 10000
              charged_unit_price:
                type: number
                minimum: 0
              bundle_id:
                type: string
                format: uuid
                nullable: true
            required: [variant_id, quantity, charged_unit_price]
      required: [id, sold_at, payment_method, displayed_total, lines]
    VoidCounterSaleRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required: [reason]
    BundleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        bundle_price:
          type: number
          minimum: 0
          nullable: true
        is_active:
          type: boolean
          default: true
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            properties:
              variant_id:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
            required: [variant_id, quantity]
      required: [name, lines]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    VariantOption:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required:
        - name
        - value
    VariantScanDetail:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        pack_quantity:
          type: number
          default: 1
        pack_unit:
          type: string
        price:
          type: number
        on_hand:
          type: number
        unit_of_measure:
          type: string
        track_stock:
          type: boolean
          default: true
        low_stock_threshold:
          type: number
          nullable: true
        options:
          type: array
          items:
            $ref: "#/components/schemas/VariantOption"
      required:
        - id
        - price
        - on_hand
        - unit_of_measure
        - options
    ProductScanDetail:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        image_url:
          type: string
          nullable: true
      required:
        - id
        - title
        - slug
    BarcodeScanMatch:
      type: object
      properties:
        variant:
          $ref: "#/components/schemas/VariantScanDetail"
        product:
          $ref: "#/components/schemas/ProductScanDetail"
      required:
        - variant
        - product
    BarcodeScanResult:
      type: array
      items:
        $ref: "#/components/schemas/BarcodeScanMatch"

    Supplier:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        contact_info:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - name
        - is_active
        - created_at
        - updated_at

    SupplierInput:
      type: object
      properties:
        name:
          type: string
        contact_info:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        is_active:
          type: boolean
          default: true
      required:
        - name

    SupplierList:
      type: array
      items:
        $ref: "#/components/schemas/Supplier"

    GoodsReceiptLine:
      type: object
      properties:
        id:
          type: string
        receipt_id:
          type: string
        variant_id:
          type: string
        sku:
          type: string
          nullable: true
        product_title:
          type: string
          nullable: true
        quantity:
          type: number
        sort_order:
          type: number
        unit_cost:
          type: number
          nullable: true
        total_cost:
          type: number
          nullable: true
        created_at:
          type: string
      required:
        - id
        - receipt_id
        - variant_id
        - quantity
        - sort_order
        - created_at

    GoodsReceiptLineInput:
      type: object
      properties:
        variant_id:
          type: string
        quantity:
          type: number
        unit_cost:
          type: number
          nullable: true
        sort_order:
          type: number
      required:
        - variant_id
        - quantity

    GoodsReceiptLineUpdateInput:
      type: object
      properties:
        quantity:
          type: number
        unit_cost:
          type: number
          nullable: true
        sort_order:
          type: number

    GoodsReceipt:
      type: object
      properties:
        id:
          type: string
        receipt_number:
          type: string
        supplier_id:
          type: string
          nullable: true
        supplier_name:
          type: string
          nullable: true
        posting_date:
          type: string
        reference_note:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, posted, reversed]
        transaction_id:
          type: string
          nullable: true
        additional_costs:
          type: number
          nullable: true
        total_quantity:
          type: number
        total_cost:
          type: number
          nullable: true
        lines:
          type: array
          items:
            $ref: "#/components/schemas/GoodsReceiptLine"
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - receipt_number
        - posting_date
        - status
        - created_at
        - updated_at

    GoodsReceiptInput:
      type: object
      properties:
        supplier_id:
          type: string
          nullable: true
        posting_date:
          type: string
        reference_note:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        additional_costs:
          type: number
          nullable: true

    GoodsReceiptReverseInput:
      type: object
      properties:
        reason:
          type: string

    GoodsReceiptList:
      type: array
      items:
        $ref: "#/components/schemas/GoodsReceipt"

    MarginReportVariantRow:
      type: object
      properties:
        variant_id:
          type: string
        sku:
          type: string
          nullable: true
        product_id:
          type: string
        product_title:
          type: string
        category_id:
          type: string
          nullable: true
        category_name:
          type: string
          nullable: true
        revenue:
          type: number
        cogs:
          type: number
        gross_margin:
          type: number
        margin_percent:
          type: number
        units_sold:
          type: number
