name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # ─── Reliable gate: typecheck + pure unit/property tests ──────────────────
  # No external dependencies (no DB secrets, no running servers, no browsers).
  # This job must always pass and gates every push to main.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run unit tests (store)
        run: pnpm exec vitest --run --project store-unit

  # ─── Integration + E2E: requires Supabase secrets and running servers ─────
  # Runs in parallel with `unit` (both must pass; waiting for unit cost ~45s). Needs repo
  # secrets: SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY.
  integration-e2e:
    runs-on: ubuntu-24.04
    # Chromium and its system libraries come preinstalled. `playwright install --with-deps`
    # took 45-270s, mostly apt downloading 32 MB at ~140 kB/s (2026-11-18).
    # The tag MUST match @playwright/test in pnpm-lock.yaml (1.60.0); a mismatch fails loudly
    # with "Executable doesn't exist".
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 20
    # One shared Supabase test project: two runs at once delete each other's fixtures
    # (orders.test "Variant not found", 2026-11-18). Queue them instead.
    # ponytail: GitHub keeps one pending run per group, so a third queued run replaces the
    # second; a per-run database (Supabase branch) would remove the queue if that ever hurts.
    concurrency:
      group: supabase-test-project
      cancel-in-progress: false

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # ─── Exploration-test fixed-state toggles ──────────────────────────────
      # The SEC-00x exploration files default to the UNFIXED expectation and flip
      # to the fixed-state assertion when these are set to "1". All fixes
      # (SEC-001, SEC-002/003/004, SEC-005/006/007) are now LIVE on the DB + in
      # code, so CI must assert the FIXED state — otherwise the re-run
      # exploration tests would assert the old pre-migration behavior and fail
      # against the now-fixed database. (The SEC-005 leg is a no-toggle invariant
      # and is unaffected.) The `unit` job runs only `store-unit` (no toggle
      # files), so it intentionally does not set these.
      # OTP_VERIFY_FIXED is the fourth toggle, asserting the fixed OTP verify recovery path.
      SEC001_FIXED: "1"
      P1_FIXED: "1"
      P2_FIXED: "1"
      OTP_VERIFY_FIXED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run component tests
        run: pnpm --filter @workspace/store run test:ct:ci

      - name: Seed test data
        run: pnpm run seed:test

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Start API server
        # nohup + a log file: in the container a bare `&` child did not outlive its step, and
        # its output was lost. The log is printed if the job fails.
        run: nohup pnpm --filter @workspace/api-server run start > /tmp/api-server.log 2>&1 &
        env:
          PORT: "5000"
          NODE_ENV: development
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          # Test-only: bypass the SEC-004 auth rate limiter for this CI server.
          # The api-integration suite drives ~12 login-using files from one IP
          # with shuffle on, exceeding 10 req/min and tripping a 429 (60s window
          # > 30s test timeout, so retry can't recover). NEVER set this in prod
          # (Vercel / Railway) — it disables OTP brute-force protection.
          E2E_DISABLE_AUTH_RATELIMIT: "1"

      - name: Wait for API health endpoint
        run: |
          timeout=30
          elapsed=0
          until curl -sf http://localhost:5000/api/healthz > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "API server failed to start within ${timeout}s"
              exit 1
            fi
            sleep 1
            elapsed=$((elapsed + 1))
          done
          echo "API server is healthy"

      - name: Run API integration tests
        run: pnpm exec vitest --run --project api-integration --project env-validation
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      # Runs alone because allow_negative_stock is a global tenant setting that breaks parallel stock tests.
      - name: Run serial integration tests (global settings)
        run: pnpm --filter @workspace/api-server exec vitest --run --config vitest.config.serial.ts
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Start store dev server
        run: nohup pnpm --filter @workspace/store run dev > /tmp/store-dev.log 2>&1 &
        env:
          VITE_API_BASE_URL: http://localhost:5000/api
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Wait for store server
        run: |
          timeout=60
          elapsed=0
          until curl -sf http://localhost:3000 > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "Store server failed to start within ${timeout}s"
              exit 1
            fi
            sleep 1
            elapsed=$((elapsed + 1))
          done
          echo "Store server is ready"

      - name: Run E2E tests
        run: pnpm --filter @workspace/store run test:e2e
        env:
          BASE_URL: http://localhost:3000

      - name: Server logs on failure
        if: failure()
        run: tail -n 100 /tmp/api-server.log /tmp/store-dev.log || true

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/store/test-results/
          retention-days: 7
